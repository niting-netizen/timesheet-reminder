<title>Timesheet Reminder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: admin console. Sticky top bar with save state, a left rail for navigation, and one content column of setting cards. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunken:#eceff4; --ink:#17202b; --muted:#566273; --line:#d8dee6;
  --accent:#1d5fc4; --accent-soft:#e2ebfa; --on-accent:#ffffff; --knob:#ffffff;
  --ok:#17744a; --ok-soft:#dff2e8; --bad:#c22a2a; --bad-soft:#fbe5e5; --warn:#8f5500; --warn-soft:#fbefd9;
  --scrim:rgba(12,18,26,.55);
  --font-display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131a; --surface:#151c25; --sunken:#1c2530; --ink:#e5eaf0; --muted:#97a2b2; --line:#2a3442;
    --accent:#6e9ff5; --accent-soft:#1d2d47; --on-accent:#0e131a; --knob:#e5eaf0;
    --ok:#4cc08a; --ok-soft:#173327; --bad:#ff7373; --bad-soft:#3a1d1f; --warn:#f0b452; --warn-soft:#3a2c14;
    --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c25; --sunken:#1c2530; --ink:#e5eaf0; --muted:#97a2b2; --line:#2a3442;
  --accent:#6e9ff5; --accent-soft:#1d2d47; --on-accent:#0e131a; --knob:#e5eaf0;
  --ok:#4cc08a; --ok-soft:#173327; --bad:#ff7373; --bad-soft:#3a1d1f; --warn:#f0b452; --warn-soft:#3a2c14;
  --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
/* Elements with the hidden attribute must stay hidden even when a class sets display (modal, toast). */
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:22px;font-weight:600}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--font-display);font-size:17px;font-weight:600}
.brand svg{flex:none}
.pill{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600;white-space:nowrap}
.savebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dirty{font-size:12.5px;color:var(--warn);font-weight:600}

/* Shell */
.app{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;max-width:1320px;margin:0 auto;
  padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:12px 10px 4px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;white-space:nowrap}
nav a:hover{background:var(--sunken)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .count{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .nav-label{display:none}
}

/* Page */
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.sub{color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1060px){.split{grid-template-columns:minmax(0,1fr)}}
.notice{border-radius:var(--radius);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--font-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.stat .v.small{font-size:16px;font-family:var(--font-body);padding-top:8px}
.stat.bad .v{color:var(--bad)} .stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)}

/* Forms */
.fields{display:grid;gap:12px}
.fields.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label,.label{font-size:12px;font-weight:600;color:var(--muted)}
input:not([type=checkbox]):not([type=radio]),select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
textarea.code{font-family:var(--font-mono);font-size:12.5px}
input:disabled,select:disabled{background:var(--sunken);color:var(--muted)}
.help{font-size:12px;color:var(--muted)}
.secret{display:flex;gap:6px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Buttons */
.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-busy="true"]{cursor:progress;opacity:.7}

/* Switch */
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink)}
.switch input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--knob);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(14px)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);font-weight:400;cursor:pointer}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.idle{background:var(--sunken);color:var(--muted)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.test-out{font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.test-out .ok{color:var(--ok);font-weight:600} .test-out .bad{color:var(--bad);font-weight:600}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}

/* Tables */
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.red{color:var(--bad);font-weight:600}
.bar{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--sunken);vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.full i{background:var(--ok)}
.who{display:flex;flex-direction:column}
.who small{color:var(--muted);font-size:11.5px}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:620px){.filters{grid-template-columns:minmax(0,1fr)}}

/* Segmented provider choice */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-weight:400;font-size:13px}
.seg label b{display:block;font-size:14px}
.seg label small{color:var(--muted);font-size:12px}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg input{margin-top:3px;accent-color:var(--accent)}

/* Mode explainer */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.mode{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.mode b{color:var(--ink);font-size:13.5px}

/* Recipient picker */
.picker{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.picker .check small{color:var(--muted)}
.addr{display:flex;flex-wrap:wrap;gap:6px}
.addr span{font-family:var(--font-mono);font-size:11.5px;background:var(--sunken);border-radius:4px;padding:2px 6px;overflow-wrap:anywhere}

/* Template editor */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:13px;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 10px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.phs{display:flex;flex-wrap:wrap;gap:6px}
.phs button{font-family:var(--font-mono);font-size:11.5px;background:var(--sunken);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer}
.phs button:hover{border-color:var(--accent);color:var(--accent)}
.mail{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.mail-head{background:var(--sunken);padding:10px 14px;font-size:12.5px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
.mail-head dt{color:var(--muted)} .mail-head dd{margin:0;overflow-wrap:anywhere}
.mail-body{padding:16px;line-height:1.6;overflow-x:auto;font-size:13.5px}
.mail-body table{width:auto;margin:6px 0;border:1px solid var(--line)}
.mail-body th,.mail-body td{border:1px solid var(--line);padding:5px 10px;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink)}
.mail-body th{background:var(--sunken)}
mark.unknown{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 2px}
.suggest{border:1px dashed var(--accent);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.suggest pre{margin:0;white-space:pre-wrap;font-family:var(--font-body);font-size:13px;max-height:260px;overflow:auto;background:var(--sunken);padding:10px;border-radius:6px}

/* Timeline */
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.tl .when{font-family:var(--font-mono);font-size:12.5px}
@media (max-width:520px){.tl{grid-template-columns:minmax(0,1fr) auto}.tl .when{grid-column:1/-1}}

/* Modal + toast */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{width:min(720px,100%);max-height:100%;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;max-width:min(560px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="var(--accent)"/><rect x="5" y="14" width="2.6" height="7" rx="1" fill="var(--on-accent)"/><rect x="8.8" y="10" width="2.6" height="11" rx="1" fill="var(--on-accent)"/><rect x="12.6" y="7" width="2.6" height="14" rx="1" fill="var(--on-accent)"/><rect x="16.4" y="12" width="2.6" height="9" rx="1" fill="var(--on-accent)"/><rect x="20.2" y="16" width="1.6" height="5" rx=".8" fill="var(--on-accent)" opacity=".55"/></svg>
    <b>Timesheet Reminder</b>
    <span class="pill">Prototype · sample data</span>
  </div>
  <label class="switch" title="Dry run renders emails and logs them without sending"><input type="checkbox" id="hdr-dry" data-bind="dryRun" data-rerender> Dry run</label>
  <div class="savebar">
    <span class="dirty" id="dirty" hidden>Unsaved changes</span>
    <button class="btn ghost" id="btn-discard" data-action="discard" disabled>Discard</button>
    <button class="btn primary" id="btn-save" data-action="save" disabled>Save settings</button>
  </div>
</header>

<div class="app">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="view"></main>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="card">
    <div class="card-head"><h2 id="modal-title">Export</h2><button class="btn ghost sm" data-action="close-modal">Close</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const KEY='tsr-prototype-settings-v1';
const DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
const DAY_LABEL={MON:'Monday',TUE:'Tuesday',WED:'Wednesday',THU:'Thursday',FRI:'Friday',SAT:'Saturday',SUN:'Sunday'};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const BASE_MONDAY=new Date(2026,10,9); // week 46 of 2026
const WEEK_NO=46;
const SECRET_KEYS=['apiKey','clientSecret','refreshToken','password'];

const SOURCE_META={
  jira:{name:'Jira',hint:'Jira Cloud · service account email + API token',urlPh:'https://yourcompany.atlassian.net',userLabel:'Service account email',keyLabel:'API token',testCall:'GET /rest/api/3/myself'},
  redmine:{name:'Redmine',hint:'REST API · X-Redmine-API-Key header',urlPh:'https://redmine.yourcompany.com',userLabel:'Service user login',keyLabel:'API key',testCall:'GET /users/current.json'},
  pulse:{name:'Pulse',hint:'Internal app · access method to be confirmed',urlPh:'https://pulse.yourcompany.com',userLabel:'Service user',keyLabel:'API key or token',testCall:'Endpoint to be confirmed with the Pulse owner'},
  texpert:{name:'Texpert',hint:'Planned · connector or file import',urlPh:'https://texpert.yourcompany.com',userLabel:'Service user',keyLabel:'API key',testCall:'Parse an uploaded sample export'}
};
const MODE_LABEL={broadcast:'Broadcast',individual:'Individual',custom:'Custom list'};

const T_GENERAL=`Hi Team,

This is a gentle reminder to review and complete your {applications} timesheet from {week_start} to {week_end}.

Note: If you are going on leave or have planned leave, please update your timesheet in advance before going on leave.

Managers and Team Leads, it is your responsibility to ensure that resources submit their timesheets on time.

Please ensure the following while updating your logs:
• Log a minimum of {daily_hours} hours per working day, or more if you have worked additional hours.
• If you have taken leave, log the leave hours against {leave_ticket}.
• Public holiday hours must be logged against {public_holiday_ticket}.
• Verify that all hours are tagged to the correct {applications} tickets.
• If there is no project work assigned, log your hours under {bench_ticket}.
• Do not log hours under any Miscellaneous or Common ticket if you are actively working on a project; log them against the relevant project tickets only.

100% of employee work logs must be updated accurately by the end of the day to avoid any discrepancies.

Best Regards,
{sender_name}
{sender_title}
Iksula Services Pvt Ltd
{office_addresses}`;
const T_PENDING=`Hi Team,

Please see the list below of employees who are pending to fill their {applications} hours. Pending hours are highlighted in red.

A total of {pending_count} employees are still pending. Please update it soon; the next updated pending list will be shared after {next_run_time}.

Note: {source_notes}

{pending_table}

Best Regards,
{sender_name}`;
const T_INDIVIDUAL=`Hi {employee_name},

Our system shows the following status for your timesheet for Week {week_number} ({week_start} to {week_end}):
• Required hours: {required}
• Hours logged: {logged}
• Pending hours: {pending}

Please update your remaining hours at the earliest. Reminders stop automatically once your logged hours reach the required hours.

Regards,
Timesheet Automation System`;

const DEFAULT_TEMPLATES={
  R1:{subject:'Timesheet Reminder: {week_start} to {week_end}',body:T_GENERAL},
  R2:{subject:'Timesheet Reminder (last day): {week_start} to {week_end}',body:T_GENERAL.replace('{week_end}.\n','{week_end}.\n\nToday is the last working day of the week, so please complete your hours before you log off.\n')},
  R3:{subject:'Timesheet Pending List #{report_number}: {pending_count} employees pending',body:T_PENDING},
  REPEAT:{subject:'Timesheet Pending List #{report_number} (updated): {pending_count} employees pending',body:T_PENDING.replace('Please see the list below','Here is the updated list')},
  INDIVIDUAL:{subject:'Action needed: complete your timesheet for {week_start} to {week_end}',body:T_INDIVIDUAL}
};

const DEFAULTS={
  sources:[
    {type:'jira',enabled:true,baseUrl:'',authType:'api_token',username:'',apiKey:'',lastTest:null},
    {type:'redmine',enabled:true,baseUrl:'',authType:'api_key',username:'',apiKey:'',lastTest:null},
    {type:'pulse',enabled:true,baseUrl:'',authType:'api',username:'',apiKey:'',lastTest:null},
    {type:'texpert',enabled:false,baseUrl:'',authType:'csv_import',username:'',apiKey:'',lastTest:null}
  ],
  emailProvider:{type:'gmail',from:'timesheet@company.example',fromName:'Timesheet Reminder',replyTo:'',
    gmail:{clientId:'',clientSecret:'',refreshToken:''},
    graph:{tenantId:'',clientId:'',clientSecret:''},
    smtp:{host:'smtp-relay.gmail.com',port:587,security:'starttls',user:'',password:''},
    lastTest:null},
  recipients:{broadcastList:['timesheet-all@company.example','managers-leads@company.example'],customSelected:[],customExtra:'',cc:[]},
  week:{startDay:'MON',endDay:'FRI',weeklyHours:40,dailyOverride:0,timezone:'Asia/Kolkata'},
  schedule:{events:[
    {id:'R1',label:'Reminder 1 · general',enabled:true,day:'THU',time:'11:00',mode:'broadcast'},
    {id:'R2',label:'Reminder 2 · general',enabled:true,day:'FRI',time:'11:00',mode:'broadcast'},
    {id:'R3',label:'Reminder 3 · first pending report',enabled:true,day:'FRI',time:'13:00',mode:'broadcast'},

/* ---------- helpers ---------- */
function clone(o){return JSON.parse(JSON.stringify(o));}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=x=>Math.round(x*10)/10;
const hrs=x=>String(r1(x));
const isEmail=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||'').trim());
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function fmt(d){return String(d.getDate()).padStart(2,'0')+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();}
function toMin(t){const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?(+m[1])*60+(+m[2]):NaN;}
function fromMin(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function t12(t){const n=toMin(t);if(isNaN(n))return t||'';let h=Math.floor(n/60),m=n%60;const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+ap;}
function nowLabel(){const d=new Date();const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];return wd+' '+fmt(d)+', '+t12(fromMin(d.getHours()*60+d.getMinutes()));}
function getPath(o,p){return p.split('.').reduce((c,k)=>c==null?c:c[k],o);}
function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v;}
function parseList(v){return String(v).split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);}
function merge(base,over){
  if(Array.isArray(base)||Array.isArray(over))return over===undefined?base:over;
  if(base&&typeof base==='object'&&over&&typeof over==='object'){const r={...base};for(const k in over)r[k]=k in base?merge(base[k],over[k]):over[k];return r;}
  return over===undefined?base:over;
}
function stripSecrets(o){
  if(Array.isArray(o))return o.map(stripSecrets);
  if(o&&typeof o==='object'){const r={};for(const k in o)r[k]=SECRET_KEYS.includes(k)?'':stripSecrets(o[k]);return r;}
  return o;
}

/* ---------- domain ---------- */
function weekInfo(){
  const s=DAYS.indexOf(S.week.startDay),e=DAYS.indexOf(S.week.endDay);
  const days=e>=s?e-s+1:0;
  const daily=S.week.dailyOverride>0?S.week.dailyOverride:(days?S.week.weeklyHours/days:0);
  return {days,daily,start:addDays(BASE_MONDAY,s),end:addDays(BASE_MONDAY,Math.max(e,s)),valid:days>0&&S.week.weeklyHours>0,num:WEEK_NO};
}
function srcConf(type){return S.sources.find(x=>x.type===type);}
function sourceState(type){
  const s=srcConf(type);
  if(!s||!s.enabled)return 'disabled';
  if(s.lastTest&&!s.lastTest.ok)return 'failed';
  return 'ok';
}
function rowFor(e){
  const w=weekInfo();
  const logged=r1(Object.values(e.logs).reduce((a,b)=>a+b,0));
  const target=r1(Math.max(0,S.week.weeklyHours-e.leave*w.daily));
  const srcs=Object.keys(e.logs);
  const bad=srcs.filter(t=>sourceState(t)!=='ok');
  const pending=r1(Math.max(0,target-logged));
  const status=bad.length?'source':(pending<=0?'complete':'pending');
  const pct=target?Math.min(100,logged/target*100):100;
  return {...e,logged,target,pending,status,pct,srcs,bad};
}
function rows(){return emp.map(rowFor);}
function pendingRows(){return rows().filter(r=>r.status==='pending');}
function apps(){return S.sources.filter(s=>s.enabled).map(s=>SOURCE_META[s.type].name).join(' / ')||'timesheet';}
function sourceNotes(){
  const notes=[];
  S.sources.forEach(s=>{
    const used=emp.some(e=>s.type in e.logs);
    if(!used)return;
    const st=sourceState(s.type);
    if(st==='failed')notes.push(SOURCE_META[s.type].name+' data not received (last connection test failed). Affected employees are held back, not marked pending.');
    if(st==='disabled')notes.push(SOURCE_META[s.type].name+' is turned off. Affected employees are held back, not marked pending.');
  });
  return notes;
}
function customList(){
  const set=new Set([...(S.recipients.customSelected||[]),...parseList(S.recipients.customExtra||'')]);
  return [...set];
}
function recipientPlan(ev){
  const pend=pendingRows();
  const general=ev.id==='R1'||ev.id==='R2';
  if(ev.mode==='individual'){
    return {emails:pend.length,to:pend.map(p=>p.email),desc:pend.length+' separate emails. Each person sees only their own hours.'};
  }
  const list=ev.mode==='custom'?customList():S.recipients.broadcastList;
  const what=general?'the general reminder (no table)':'a table of '+pend.length+' pending employees';
  const n=list.length,s=n===1?'':'es';
  const who=ev.mode==='custom'?(n===1?'only the 1 selected address':'only the '+n+' selected addresses'):n+' broadcast address'+s;
  return {emails:list.length?1:0,to:list,desc:'One email to '+who+' with '+what+'.'};
}
function timeline(){
  const [e1,e2,e3,rep]=S.schedule.events;
  const out=[];
  const w=weekInfo();
  const sIdx=DAYS.indexOf(S.week.startDay),eIdx=DAYS.indexOf(S.week.endDay);
  const winFrom=toMin(S.schedule.windowFrom),winTo=toMin(S.schedule.windowTo),cut=toMin(S.schedule.cutoff);
  const flag=(day,time)=>{
    const d=DAYS.indexOf(day),t=toMin(time);
    if(d<sIdx||d>eIdx)return 'Skipped: not a working day';
    if(t<winFrom||t>winTo)return 'Skipped: outside allowed hours';
    return '';
  };
  [e1,e2].forEach(e=>{if(e.enabled)out.push({day:e.day,time:e.time,label:e.id+' · General reminder',mode:e.mode,skip:flag(e.day,e.time)});});
  if(e3.enabled){
    let n=1;
    out.push({day:e3.day,time:e3.time,label:'R3 · Pending list #1',mode:e3.mode,skip:flag(e3.day,e3.time)});
    if(rep.enabled){
      const step=Math.max(0.5,Number(rep.interval)||2)*60;
      let t=toMin(e3.time)+step;
      while(!isNaN(t)&&t<=cut&&t<24*60&&n<S.schedule.maxReminders){
        n++;
        out.push({day:e3.day,time:fromMin(t),label:'Repeat · Pending list #'+n,mode:rep.mode,skip:flag(e3.day,fromMin(t))});
        t+=step;
      }
    }
  }
  out.sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||toMin(a.time)-toMin(b.time));
  return {items:out,valid:w.valid};
}
function nextRunFor(tid){
  const e3=S.schedule.events[2],rep=S.schedule.events[3];
  const step=Math.max(0.5,Number(rep.interval)||2)*60;
  const t=toMin(e3.time)+step*(tid==='REPEAT'?2:1);
  if(!rep.enabled||t>toMin(S.schedule.cutoff))return 'the final check';
  return t12(fromMin(t));
}

function idOf(p){return 'f-'+p.replace(/\./g,'-');}
function field(label,path,o){
  o=o||{};
  const id=idOf(path),v=getPath(S,path),help=o.help?'<p class="help">'+o.help+'</p>':'';
  const rr=o.rerender?' data-rerender':'';
  const dis=o.disabled?' disabled':'';
  if(o.type==='select'){
    return '<div class="field"><label for="'+id+'">'+label+'</label><select id="'+id+'" data-bind="'+path+'"'+rr+dis+'>'+
      o.options.map(([val,lab])=>'<option value="'+esc(val)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(lab)+'</option>').join('')+'</select>'+help+'</div>';
  }
  if(o.type==='textarea'){
    const val=o.list?(v||[]).join('\n'):v;
    return '<div class="field"><label for="'+id+'">'+label+'</label><textarea id="'+id+'" rows="'+(o.rows||3)+'" data-bind="'+path+'"'+(o.list?' data-list':'')+(o.code?' class="code"':'')+' spellcheck="'+(o.code?'false':'true')+'" placeholder="'+esc(o.ph||'')+'">'+esc(val)+'</textarea>'+help+'</div>';
  }
  if(o.type==='secret'){
    return '<div class="field"><label for="'+id+'">'+label+'</label><div class="secret"><input id="'+id+'" type="password" autocomplete="off" spellcheck="false" data-bind="'+path+'" value="'+esc(v)+'" placeholder="'+esc(o.ph||'')+'"'+dis+'><button type="button" class="btn ghost sm" data-action="reveal" data-target="'+id+'">Show</button></div>'+help+'</div>';
  }
  const t=o.type||'text';
  const extra=(o.min!=null?' min="'+o.min+'"':'')+(o.max!=null?' max="'+o.max+'"':'')+(o.step!=null?' step="'+o.step+'"':'');
  return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+t+'" data-bind="'+path+'" value="'+esc(v)+'" placeholder="'+esc(o.ph||'')+'"'+extra+rr+dis+' autocomplete="off">'+help+'</div>';
}
function sw(label,path,rerender){
  const id=idOf(path);
  return '<label class="switch" for="'+id+'"><input type="checkbox" id="'+id+'" data-bind="'+path+'"'+(rerender?' data-rerender':'')+(getPath(S,path)?' checked':'')+'> '+label+'</label>';

function suggestBox(){
  if(!suggestion)return '';
  if(suggestion.error)return '<div class="notice warn">'+esc(suggestion.error)+'</div>';
  if(suggestion.same)return '<div class="notice info">No changes suggested for this template.</div>';
  return '<div class="suggest"><div class="card-head"><h3>Suggested '+esc(suggestion.kind)+' version</h3><span class="hint">Simulated in the prototype</span></div><pre>'+esc(suggestion.text)+'</pre><div class="inline"><button class="btn primary sm" data-action="ai-apply">Apply</button><button class="btn ghost sm" data-action="ai-discard">Discard</button></div></div>';
}
function eventForTpl(tid){return S.schedule.events.find(e=>e.id===tid);}
function ctx(tid,person){
  const w=weekInfo(),pend=pendingRows();
  const ph=(v,label)=>v?v:'['+label+' not set]';
  const notes=sourceNotes();
  return {
    week_start:fmt(w.start),week_end:fmt(w.end),week_number:w.num,applications:apps(),
    daily_hours:hrs(w.daily),weekly_hours:S.week.weeklyHours,
    leave_ticket:ph(S.tickets.leave,'leave ticket'),public_holiday_ticket:ph(S.tickets.holiday,'holiday ticket'),bench_ticket:ph(S.tickets.bench,'bench ticket'),
    sender_name:S.signature.name,sender_title:S.signature.title,office_addresses:ph(S.signature.addresses,'office addresses'),
    report_number:tid==='REPEAT'?2:1,pending_count:pend.length,next_run_time:nextRunFor(tid),
    source_notes:notes.length?notes.join(' '):'Data received from all enabled sources.',
    pending_table:'<table><thead><tr><th>EMP ID</th><th>Employee</th><th>Filled</th><th>Required</th><th>Pending</th></tr></thead><tbody>'+
      pend.map(p=>'<tr><td>'+p.code+'</td><td>'+esc(p.name)+'</td><td>'+hrs(p.logged)+'</td><td>'+hrs(p.target)+'</td><td style="color:var(--bad);font-weight:700">'+hrs(p.pending)+'</td></tr>').join('')+
      (pend.length?'':'<tr><td colspan="5">Nobody is pending.</td></tr>')+'</tbody></table>',
    employee_name:person?person.name:'',required:person?hrs(person.target):'',logged:person?hrs(person.logged):'',pending:person?hrs(person.pending):''
  };
}
function fillHtml(text,c){return esc(text).replace(/\{(\w+)\}/g,(m,k)=>!(k in c)?'<mark class="unknown" title="Unknown placeholder">'+m+'</mark>':(k==='pending_table'?c[k]:esc(String(c[k]))));}
function fillText(text,c){return String(text).replace(/\{(\w+)\}/g,(m,k)=>!(k in c)?m:(k==='pending_table'?'[table]':String(c[k])));}
function refreshTemplates(){
  const box=document.getElementById('tpl-preview');if(!box)return;
  const ev=eventForTpl(curTpl);
  let tid=curTpl,note='';
  if(ev&&ev.mode==='individual'&&curTpl!=='INDIVIDUAL'){note='<div class="notice info">This reminder is set to Individual on the Recipients page, so each person receives the Individual template instead. Preview shown as configured here.</div>';}
  const person=pendingRows()[0];
  const indiv=curTpl==='INDIVIDUAL';
  const c=ctx(tid,person);
  const t=S.templates[curTpl];
  let to;
  if(indiv)to=person?person.email:'(nobody pending)';
  else{const p=recipientPlan(ev);to=p.to.length?p.to.slice(0,3).join(', ')+(p.to.length>3?' +'+(p.to.length-3)+' more':''):'(no recipients)';}
  const unknown=[...(t.subject+t.body).matchAll(/\{(\w+)\}/g)].map(m=>m[1]).filter(k=>!(k in c));
  box.innerHTML=note+(unknown.length?'<div class="notice warn">Unknown placeholder: '+[...new Set(unknown)].map(u=>'{'+esc(u)+'}').join(', ')+'. It will be sent as typed.</div>':'')+
    '<div class="mail"><dl class="mail-head"><dt>From</dt><dd>'+esc(S.emailProvider.fromName)+' &lt;'+esc(S.emailProvider.from)+'&gt;</dd><dt>To</dt><dd>'+esc(to)+'</dd><dt>Subject</dt><dd><b>'+esc(fillText(t.subject,c))+'</b></dd></dl>'+
    '<div class="mail-body">'+fillHtml(t.body,c).replace(/\n/g,'<br>')+'</div></div>'+
    (indiv&&person?'<p class="help">Preview for '+esc(person.name)+'. Each pending person gets their own copy with only their numbers.</p>':'');
}
function aiTransform(kind,b){
  let x=b;
  if(kind==='shorten')x=b.split('\n').filter(l=>!/^Note:|^Managers and Team Leads|^100% of employee|^• Verify that all hours|^• Do not log hours/.test(l)).join('\n').replace(/\n{3,}/g,'\n\n');
  if(kind==='firm')x=b.replace('This is a gentle reminder to review and complete','Please complete').replace('Please update it soon;','Please complete your hours now;').replace('Please update your remaining hours at the earliest.','Please log your remaining hours today.');
  if(kind==='friendly')x=b.replace(/^Hi Team,/,'Hi everyone,').replace('Please update it soon;','A quick update would really help;').replace('Please update your remaining hours at the earliest.','When you have a moment today, please add your remaining hours. Thank you!');
  if(kind==='polish')x=b.replace(/[ \t]+$/gm,'').replace(/\n{3,}/g,'\n\n').replace('who are pending to fill their','who have not yet filled in their').replace('Please update it soon;','Please update your hours soon;').replace('timesheet from {week_start}','timesheet for {week_start}');
  return x;
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;},3800);}
function openModal(title,html){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').hidden=false;}

const ACTIONS={
  save(){
    try{localStorage.setItem(KEY,JSON.stringify(stripSecrets(S)));dirty=false;updateSaveBar();toast('Settings saved. API keys are not stored in this prototype.');}
    catch(e){dirty=false;updateSaveBar();toast('Settings applied for this visit. Your browser blocked saving, so they reset on reload.');}
  },
  discard(){S=load();dirty=false;suggestion=null;render();toast('Changes discarded.');},
  reveal(b){const i=document.getElementById(b.dataset.target);if(!i)return;const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'Hide':'Show';},
  'test-source'(b){
    const i=+b.dataset.i,s=S.sources[i],m=SOURCE_META[s.type];busy(b);
    setTimeout(()=>{
      let r;
      const key=(s.apiKey||'').trim(),url=(s.baseUrl||'').trim();
      if(s.authType==='csv_import')r=result(true,'Ready for file import. Columns are checked on each upload.');
      else if(!url)r=result(false,'Enter the '+(s.authType==='db_view'?'database host':'base URL')+'.');
      else if(s.authType!=='db_view'&&!/^https:\/\/[^\s/]+\.[^\s]+$/.test(url))r=result(false,'Base URL must start with https:// and include the full domain.');
      else if(s.type==='jira'&&!isEmail(s.username))r=result(false,'Jira Cloud needs the service account email as the user.');
      else if(!key)r=result(false,'Enter the '+(s.authType==='db_view'?'password':m.keyLabel.toLowerCase())+'.');
      else if(key.length<8||/wrong|bad|fail/i.test(key))r=result(false,'401 Unauthorized. The '+m.keyLabel.toLowerCase()+' was rejected. Check it and try again.');
      else r=result(true,'Connected as '+(s.username||'service user')+' with read-only access.');
      s.lastTest=r;markDirty();render();toast(m.name+': '+(r.ok?'connection works':'connection failed'));
    },700+Math.random()*500);
  },
  'test-provider'(b){
    const e=S.emailProvider;busy(b);
    setTimeout(()=>{
      let r;const need=(o,keys)=>keys.find(k=>!String(o[k]||'').trim());
      const labels={clientId:'client ID',clientSecret:'client secret',refreshToken:'refresh token',tenantId:'tenant ID',host:'SMTP host',user:'username',password:'password'};
      if(!isEmail(e.from))r=result(false,'Enter a valid From address, for example timesheet@company.example.');
      else if(e.replyTo&&!isEmail(e.replyTo))r=result(false,'The reply-to address is not valid.');
      else{
        const sub=e[e.type];
        const keys=e.type==='gmail'?['clientId','clientSecret','refreshToken']:e.type==='graph'?['tenantId','clientId','clientSecret']:['host','user','password'];
        const miss=need(sub,keys);
        if(miss)r=result(false,'Enter the '+labels[miss]+'.');
        else if(e.type==='smtp'&&!(sub.port>=1&&sub.port<=65535))r=result(false,'Port must be a number between 1 and 65535.');
        else if(/wrong|bad|fail/i.test(sub.clientSecret||sub.password||''))r=result(false,e.type==='smtp'?'535 Authentication failed. Check the username and password.':'invalid_client. The credentials were rejected.');
        else r=result(true,(e.type==='smtp'?'SMTP handshake OK':'Token issued')+'. Test message '+(S.dryRun?'rendered (dry run, not sent)':'sent')+' to '+e.from+'.');
      }
      e.lastTest=r;markDirty();render();toast('Email provider: '+(r.ok?'connection works':'connection failed'));
    },800+Math.random()*500);
  },
  'test-ai'(b){
    const a=S.ai;busy(b);
    setTimeout(()=>{
      const k=(a.apiKey||'').trim();let r;
      if(!k)r=result(false,'Enter the Groq API key.');
      else if(!k.startsWith('gsk_'))r=result(false,'Groq keys start with gsk_. Check that you copied the whole key.');
      else if(k.length<20||/wrong|bad|fail/i.test(k))r=result(false,'401 Invalid API key.');
      else r=result(true,'Key works. '+a.model+' is available.');
      a.lastTest=r;markDirty();render();toast('Groq: '+(r.ok?'connection works':'connection failed'));
    },600+Math.random()*400);
  },
  'run-check'(b){
    busy(b,'Checking…');
    setTimeout(()=>{
      const moved=[];
      emp.forEach(e=>{
        const r=rowFor(e);
        if(r.status==='pending'&&Math.random()<0.45){
          const src=Object.keys(e.logs)[0];
          e.logs[src]=r1(e.logs[src]+Math.min(r.pending,[1,2,4,8][Math.floor(Math.random()*4)]));
          if(rowFor(e).status==='complete')moved.push(e.name);
        }
      });
      lastRun=nowLabel();render();
      toast(moved.length?'Check complete. Now complete: '+moved.join(', ')+'.':'Check complete. Some hours changed; nobody new reached the target.');
    },900);
  },
  'send-test'(){
    const to=S.emailProvider.from;
    hist.unshift({at:nowLabel(),event:'Test email',mode:'Test',to:[to],status:S.dryRun?'Dry run':'Sent (simulated)',note:'Sent from the dashboard'});
    toast(S.dryRun?'Dry run: test email rendered for '+to+'. Nothing was sent.':'Test email sent to '+to+' (simulated).');
  },
  export(){
    const h1=x=>{const v=Number(x).toFixed(1);return v==='-0.0'?'0.0':v;};
    const lines=[['EMP ID','EMP Name','Filled Hours','Need to fill hours','Pending hours'].join(',')].concat(
      rows().map(r=>[r.code,'"'+r.name+'"',h1(r.logged),h1(r.target),r.status==='source'?'Source data missing':h1(-r.pending)].join(',')));
    openModal('Export report','<p class="hint" style="margin-bottom:10px">The real app downloads this as a CSV file. In this prototype, copy the CSV below and paste it into Excel or Sheets.</p><textarea id="csv-out" class="code" rows="13" readonly>'+esc(lines.join('\n'))+'</textarea><div class="inline" style="margin-top:10px"><button class="btn primary" data-action="copy-csv">Copy CSV</button></div>');
  },
  'copy-csv'(){
    const ta=document.getElementById('csv-out');
    const fallback=()=>{ta.focus();ta.select();toast('Text selected. Press Ctrl+C to copy.');};
    try{navigator.clipboard.writeText(ta.value).then(()=>toast('CSV copied.'),fallback);}catch(e){fallback();}
  },
  'close-modal'(){document.getElementById('modal').hidden=true;},
  'tpl-tab'(b){curTpl=b.dataset.id;suggestion=null;render();},
  'insert-ph'(b){
    const ta=document.getElementById('tpl-body');const ph='{'+b.dataset.ph+'}';
    const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,e=ta.selectionEnd==null?s:ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+ph+ta.value.slice(e);ta.selectionStart=ta.selectionEnd=s+ph.length;ta.focus();
    ta.dispatchEvent(new Event('input',{bubbles:true}));
  },
  'tpl-reset'(){S.templates[curTpl]=clone(DEFAULT_TEMPLATES[curTpl]);suggestion=null;markDirty();render();toast('Template reset to the default text.');},
  'tpl-test'(){
    const to=S.emailProvider.from;
    hist.unshift({at:nowLabel(),event:'Template test · '+curTpl,mode:'Test',to:[to],status:S.dryRun?'Dry run':'Sent (simulated)',note:'Sample data'});
    toast((S.dryRun?'Dry run: ':'')+'Test of this template '+(S.dryRun?'rendered for ':'sent to ')+to+'.');
  },
  ai(b){
    const kind=b.dataset.kind;
    if(!S.ai.enabled||!(S.ai.lastTest&&S.ai.lastTest.ok)){suggestion={error:'AI assist is off. Turn it on under AI assist (Groq) and test the key first.'};}
    else{const body=S.templates[curTpl].body;const text=aiTransform(kind,body);suggestion={kind:{polish:'polished',shorten:'shorter',firm:'firmer',friendly:'friendlier'}[kind],text,same:text===body};}
    document.getElementById('ai-suggest').innerHTML=suggestBox();
  },
  'ai-apply'(){if(suggestion&&suggestion.text){S.templates[curTpl].body=suggestion.text;suggestion=null;markDirty();render();toast('Suggestion applied. Save settings to keep it.');}},
  'ai-discard'(){suggestion=null;document.getElementById('ai-suggest').innerHTML='';}
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');
  if(b&&ACTIONS[b.dataset.action]&&!b.disabled){e.preventDefault();ACTIONS[b.dataset.action](b,e);return;}
  if(e.target.id==='modal')ACTIONS['close-modal']();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modal').hidden)ACTIONS['close-modal']();});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.filter!==undefined){
    if(el.dataset.filter==='text')fText=el.value;if(el.dataset.filter==='source')fSource=el.value;if(el.dataset.filter==='status')fStatus=el.value;
    document.getElementById('emp-body').innerHTML=empRows();return;
  }
  if(el.dataset.hist!==undefined){histFilter=el.value;render();return;}
  if(el.dataset.previewEv!==undefined){previewEvent=+el.value;refresh();return;}
  if(el.dataset.custom!==undefined){
    const set=new Set(S.recipients.customSelected||[]);
    el.checked?set.add(el.dataset.custom):set.delete(el.dataset.custom);
    S.recipients.customSelected=[...set];markDirty();refresh();return;
  }
  const p=el.dataset.bind;if(!p)return;
  let v;
  if(el.type==='radio'){if(!el.checked)return;v=el.value;}
  else if(el.type==='checkbox')v=el.checked;
  else if(el.type==='number')v=el.value===''?0:Number(el.value);
  else if(el.dataset.list!==undefined)v=parseList(el.value);
  else v=el.value;
  setPath(S,p,v);
  if(p.startsWith('sources.')&&/(baseUrl|apiKey|username|authType)$/.test(p)){const i=+p.split('.')[1];S.sources[i].lastTest=null;}
  markDirty();
  if(el.dataset.rerender!==undefined)render();else{refresh();renderNav();}
});
window.addEventListener('hashchange',()=>{suggestion=null;render();window.scrollTo(0,0);});

render();
})();
</script>
